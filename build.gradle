plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

    testImplementation 'com.google.code.gson:gson:2.10.1'
}

group = 'com.dpscalc'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = '11'
    targetCompatibility = '11'
}

test {
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

task dpsTest(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dpscalc.DpsCalcTester'
    standardInput = System.in
    if (project.hasProperty('scenario')) {
        args project.scenario
    }
}

task runClient(type: JavaExec) {
    group = 'runelite'
    description = 'Run RuneLite with the DPS Calculator plugin loaded'
    
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dpscalc.DpsCalcPluginTest'
    
    jvmArgs = [
        '-ea',
        '-Xmx2g'
    ]
    args '--developer-mode', '--debug'
}
