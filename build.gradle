plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
}

group = 'com.dpscalc'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = '11'
    targetCompatibility = '11'
}

test {
    useJUnit()
    if (project.hasProperty('fixtureFuzzCount')) {
        systemProperty 'fixtureFuzz.count', project.property('fixtureFuzzCount')
    }
    if (project.hasProperty('fixtureFuzzSeed')) {
        systemProperty 'fixtureFuzz.seed', project.property('fixtureFuzzSeed')
    }
    if (project.hasProperty('fixtureFuzzIndex')) {
        systemProperty 'fixtureFuzz.index', project.property('fixtureFuzzIndex')
    }
    if (project.hasProperty('fixtureFuzzSurface')) {
        systemProperty 'fixtureFuzz.surface', project.property('fixtureFuzzSurface')
    } else if (System.getProperty('fixtureFuzz.surface') != null) {
        systemProperty 'fixtureFuzz.surface', System.getProperty('fixtureFuzz.surface')
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

task fixtureFuzzTest(type: Test) {
    useJUnit()
    include '**/FixtureFuzzReplayTest.class'
    systemProperty 'fixtureFuzz.count', project.findProperty('fixtureFuzzCount') ?: '100'
    systemProperty 'fixtureFuzz.seed', project.findProperty('fixtureFuzzSeed') ?: '0x5eed2026'
    systemProperty 'fixtureFuzz.surface', project.findProperty('fixtureFuzzSurface') ?: System.getProperty('fixtureFuzz.surface', 'baseline')
    if (project.hasProperty('fixtureFuzzIndex')) {
        systemProperty 'fixtureFuzz.index', project.property('fixtureFuzzIndex')
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

task dpsTest(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dpscalc.DpsCalcTester'
    standardInput = System.in
    if (project.hasProperty('scenario')) {
        args project.scenario
    }
}

task runClient(type: JavaExec) {
    group = 'runelite'
    description = 'Run RuneLite with the DPS Calculator plugin loaded'
    
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dpscalc.DpsCalcPluginTest'
    
    jvmArgs = [
        '-ea',
        '-Xmx2g'
    ]
    args '--developer-mode', '--debug'
}
